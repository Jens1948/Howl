name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Use fixed debug signing key (so updates install over older builds)
        run: |
          mkdir -p ~/.android
          cp .github/workflows/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Publish APK as release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk howl.apk
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build howl.apk \
            --title "Latest build" \
            --notes "Automatisch gebaut aus master, Commit ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: howl-debug-apk
          path: app/build/outputs/apk/debug/*.apk
